aid: accrobioscience
name: Accro Bioscience
description: >-
  Accro Bioscience (Suzhou) Limited, trading as Accropeutics, is a clinical-stage biopharmaceutical
  company founded in 2017 with operations in Suzhou, China and New York. It develops small-molecule
  therapeutics against regulated cell death — necroptosis, pyroptosis and ferroptosis — targeting
  the cell-death-to-inflammation loop behind inflammatory, fibrotic, autoimmune and oncology
  disease. Its pipeline is led by AC-101, an oral selective RIPK2 inhibitor in Phase Ib for
  ulcerative colitis with FDA clearance for a Phase II multi-regional IBD study; AC-201, a
  TYK2/JAK1 pseudokinase inhibitor licensed to Fosun Pharma for Greater China as FXS5626; and
  AC-003, a RIPK1 inhibitor in Phase Ib for acute graft-versus-host disease with FDA Orphan Drug
  Designation. It closed a $50M Series C led by OrbiMed in May 2026. Accro Bioscience sells drug
  candidates, not software: it runs no developer program and publishes no API, SDK or
  machine-readable API contract.
